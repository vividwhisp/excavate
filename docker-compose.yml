services:
  postgres:
    image: postgres:16-alpine
    container_name: excavate_postgres
    environment:
      POSTGRES_USER: excavate
      POSTGRES_PASSWORD: excavate
      POSTGRES_DB: excavate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excavate -d excavate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: excavate_backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://excavate:excavate@postgres:5432/excavate?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RESEARCH_MODE: ${RESEARCH_MODE:-auto}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
    restart: unless-stopped

volumes:
  pgdata:
