services:
  postgres:
    image: postgres:16-alpine
    container_name: excavate_postgres
    environment:
      POSTGRES_USER: excavate
      POSTGRES_PASSWORD: excavate
      POSTGRES_DB: excavate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excavate -d excavate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: excavate_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: excavate_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://excavate:excavate@postgres:5432/excavate?sslmode=disable
      REDIS_ADDR: redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: